[project]
name = "agente-zoco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agente-zoco = "agente_zoco:main"
evaluar-buscador = "agente_zoco.evaluacion.retrieval:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
